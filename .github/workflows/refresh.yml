name: Refresh weather data

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-weather
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORECAST_URL: "https://api.open-meteo.com/v1/forecast?latitude=48.8566&longitude=2.3522&hourly=temperature_2m,precipitation,precipitation_probability,weathercode,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,weathercode,sunrise,sunset,wind_gusts_10m_max&timezone=Europe%2FParis&forecast_days=8&models=meteofrance_seamless,ecmwf_ifs025,icon_seamless"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Open-Meteo data
        run: |
          set -euo pipefail
          mkdir -p data
          curl -sS -f --retry 3 --retry-delay 5 --max-time 20 "$FORECAST_URL" -o data/fetched.json
          jq -e '.hourly.time and .daily.time' data/fetched.json > /dev/null
          jq '. + {fetched_at: (now | todate)}' data/fetched.json > data/latest.json
          rm -f data/fetched.json
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update weather data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
